[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbl6-labor-rag"
version = "3.0.0"
description = "Vietnamese labor law GraphRAG and unified API"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pydantic-settings>=2.2", "python-dotenv>=1.0"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "sqlalchemy>=2.0.28", "psycopg2-binary>=2.9.9", "redis>=5.0.3", "python-jose[cryptography]>=3.3.0", "bcrypt>=4.1.2", "httpx>=0.27"]
rag = ["beautifulsoup4>=4.12", "lxml>=5.1", "neo4j>=5.24", "rdflib>=7.0", "pyshacl>=0.26", "qdrant-client>=1.11", "sentence-transformers>=3.1", "transformers>=4.40", "torch>=2.2", "numpy>=1.24", "google-genai>=1.0", "openai>=1.14", "anthropic>=0.25", "modal>=1.0", "requests>=2.31", "tqdm>=4.66", "pyyaml>=6.0", "boto3>=1.36,<2", "pymupdf>=1.24", "python-docx>=1.1", "pandas>=2.0", "openpyxl>=3.1", "httpx>=0.27"]
ocr = ["opencv-python-headless>=4.8", "einops>=0.6", "gdown>=4.4"]
dev = ["pytest>=7.0", "matplotlib>=3.8", "jupyterlab>=4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["labor_rag*", "src.backend*"]
exclude = ["*.venv*", "*.__pycache__*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
