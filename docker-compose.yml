# Keep the project name from when this file lived in labor_rag/, so the
# existing labor_rag_neo4j_data / labor_rag_qdrant_data volumes are reused.
name: labor_rag

services:
  neo4j:
    image: neo4j:5-community
    container_name: labor_rag_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt (driver connection)
    environment:
      - NEO4J_AUTH=neo4j/labor_rag_pw
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: labor_rag_qdrant
    ports:
      - "6333:6333"   # REST API + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
  qdrant_data:
