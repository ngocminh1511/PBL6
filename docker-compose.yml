# Keep the project name from when this file lived in labor_rag/, so the
# existing labor_rag_neo4j_data / labor_rag_qdrant_data volumes are reused.
name: labor_rag

services:
  neo4j:
    profiles: ["local"]
    image: neo4j:5-community
    container_name: labor_rag_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt (driver connection)
    environment:
      - NEO4J_AUTH=neo4j/labor_rag_pw
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    profiles: ["local"]
    image: qdrant/qdrant:latest
    container_name: labor_rag_qdrant
    ports:
      - "6333:6333"   # REST API + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:15-alpine
    profiles: ["local"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: lexgraph_db
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    profiles: ["local"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    env_file: .env
    environment:
      INTERIM_DIR: /app/data/runtime
    ports: ["8000:8000"]
    volumes: ["runtime_data:/app/data/runtime", "upload_data:/app/data/uploads"]
  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      args:
        BACKEND_ORIGIN: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  neo4j_data:
  qdrant_data:
  postgres_data:
  redis_data:
  runtime_data:
  upload_data:
